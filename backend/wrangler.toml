name = "consigliere-ingestion"
main = "src/worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false

[triggers]
# 12-hourly: live sync, re-ranking, identity matching. Hourly at :15: queued historical backfill
# (idle and free when the queue is empty) plus identity matching for newly stored rows.
# Hourly at :45: House reports read from the Clerk's PDFs.
crons = ["0 */12 * * *", "15 * * * *", "45 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "consigliere-data"
database_id = "8280f94c-5c9f-45d0-b507-f1d05601e8d5"
migrations_dir = "migrations"

[vars]
APIFY_ACTOR_ID = "4Y9oheOAZjMZ3gGqH"
TWELVE_DATA_BASE_URL = "https://api.twelvedata.com"
MARKET_SYMBOLS = "SPY,QQQ,DIA,IXIC"
PUBLISHER_USER_AGENT = "Consigliere/1.0 public-interest political-market research"
# "shadow" stores House PDF rows without serving them; "live" serves them in place of Apify's
# House rows for the same reports; "off" stops reading PDFs.
HOUSE_PTR_MODE = "shadow"
